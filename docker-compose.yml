services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: autoinfra-frontend:1.0
    container_name: autoinfra-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - autoinfra-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: autoinfra-backend:1.0
    container_name: autoinfra-backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - autoinfra-network

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: autoinfra-database:1.0
    container_name: autoinfra-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - autoinfra-network

volumes:
  postgres-data:

networks:
  autoinfra-network:
    driver: bridge
